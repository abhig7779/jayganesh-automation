name: CRM CI

# Tests the Laravel CRM in crm/app. Only runs when CRM files change, so the automation/ and
# website/ workflows are unaffected. Also called by crm-deploy.yml before every deploy.
on:
  push:
    paths:
      - "crm/**"
      - ".github/workflows/crm-ci.yml"
  pull_request:
    paths:
      - "crm/**"
      - ".github/workflows/crm-ci.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: crm/app

jobs:
  test:
    name: Pint + Pest (PHP ${{ matrix.php }}, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, gd, zip, bcmath, fileinfo, curl, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('crm/app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/app/package-lock.json

      # Pages that use @vite need the built manifest, so build before testing.
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Tests (Pest)
        run: ./vendor/bin/pest

  mysql:
    name: Migrations + Pest on MySQL 8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          # Throwaway CI database, destroyed after the job. Not a real secret.
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: crm_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    # Real environment variables beat the <env> defaults in phpunit.xml (which say sqlite),
    # so every test here runs against MySQL and catches SQLite-only SQL.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: crm_test
      DB_USERNAME: root
      DB_PASSWORD: ci-root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, gd, zip, bcmath, fileinfo, curl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('crm/app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Migrate and seed on MySQL (the same commands production runs)
        run: |
          php artisan migrate --force --no-interaction
          php artisan crm:setup --no-interaction
          php artisan migrate:fresh --seed --force --no-interaction
          php artisan migrate:rollback --force --no-interaction
          php artisan migrate --force --no-interaction

      - name: Tests (Pest on MySQL)
        run: ./vendor/bin/pest
