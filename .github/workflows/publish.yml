name: Publish posts

# Every 30 minutes from 06:35 to 22:05 IST (01:05–16:35 UTC). Calendar times are on the
# hour or half hour IST, so each post goes out within a few minutes of its slot.
on:
  schedule:
    - cron: "5,35 1-16 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Post one day now, ignoring its time (e.g. 3). Leave empty for normal run."
        required: false
      platforms:
        description: "Only these platforms, comma separated (instagram,facebook,youtube). Empty = all."
        required: false
      dry_run:
        description: "Dry run: show what would post, post nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - run: npm ci --no-audit --no-fund

      # Copy new files from the shared Google Drive folder to the media host.
      # A failed sync never blocks posting of files that are already there.
      - name: Sync media from Google Drive
        continue-on-error: true
        env:
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_USER: ${{ vars.FTP_USER }}
          FTP_DIR: ${{ vars.FTP_DIR }}
          FTP_TLS_SELF_SIGNED: ${{ vars.FTP_TLS_SELF_SIGNED }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN || secrets.GBP_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node src/sync-media.mjs

      - name: Publish due posts
        env:
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FORCE_DAY: ${{ inputs.day }}
          ONLY_PLATFORMS: ${{ inputs.platforms }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node src/publish.mjs

      # Same creative on the Google Business Profile ("What's new" post with its own SEO image and button).
      # Independent of the step above: a failed Instagram post does not stop it, and the log is saved either way.
      - name: Post to Google Business Profile
        if: always()
        continue-on-error: true
        env:
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          GBP_LOCATION: ${{ vars.GBP_LOCATION }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          FORCE_DAY: ${{ inputs.day }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node src/gbp-posts.mjs

      - name: Save posting log
        if: always() && inputs.dry_run != true
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name "jayganesh-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/posted.json state/media.json
            git commit -m "Posting log $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
