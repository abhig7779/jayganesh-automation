name: Refresh website Google reviews

# Four times a day (07:00, 12:00, 17:00, 22:00 IST). Pulls the live Google rating, review count and
# newest reviews from the shop's Business Profile API into website/lib/reviews.json; the commit makes
# Vercel redeploy the site, so the count on the website follows Google within hours.
# On any API problem the script leaves the file untouched (the site keeps its last good data).
# (Not to be confused with reviews.yml, which replies to reviews.)
on:
  schedule:
    - cron: "30 1,6,11,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-reviews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
      GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
      GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
      GBP_LOCATION: ${{ vars.GBP_LOCATION }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      HAS_SOURCE: ${{ secrets.GBP_REFRESH_TOKEN != '' || secrets.GOOGLE_MAPS_API_KEY != '' }}
    steps:
      - name: Skip when no Google login or key is set
        if: env.HAS_SOURCE != 'true'
        run: echo "::notice title=Website reviews::Neither GBP_REFRESH_TOKEN nor GOOGLE_MAPS_API_KEY is set, so the Google reviews refresh was skipped."

      - uses: actions/checkout@v4
        if: env.HAS_SOURCE == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_SOURCE == 'true'
        with:
          node-version: 20

      - name: Fetch rating, count and reviews
        if: env.HAS_SOURCE == 'true'
        run: node website/scripts/fetch-reviews.mjs

      - name: Commit if changed
        if: env.HAS_SOURCE == 'true'
        run: |
          if [[ -n "$(git status --porcelain website/lib/reviews.json)" ]]; then
            git config user.name "jayganesh-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add website/lib/reviews.json
            git commit -m "Update Google reviews"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          else
            echo "No change to website/lib/reviews.json"
          fi
